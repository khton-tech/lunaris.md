<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>Lunaris</title>
    <link rel="icon" type="image/png" href="/src-tauri/icons/icon.png" />
    <link rel="stylesheet" href="/assets/shell.css" />
  </head>
  <body>
    <div id="startup-root" class="boot-screen">
      <pre role="img" aria-label="Lunaris.md"><!-- lunaris:startup-art --></pre>
      <p role="status">Loading system</p>
    </div>
    <div id="system-root" hidden>
      <main class="boot-message">
        <p>Lunaris</p>
        <h1>Starting the system.</h1>
        <p>If this screen remains, the host could not load. Restart the application and check the installation.</p>
      </main>
    </div>
    <div id="application-root" hidden></div>
    <script type="module" src="/src/bootstrap.ts"></script>
  </body>
</html>
