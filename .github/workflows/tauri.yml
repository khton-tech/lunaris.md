name: Tauri host checks
on:
  pull_request:
    paths:
      - 'hosts/tauri/**'
      - 'packages/kernel/**'
      - 'packages/sdk/**'
      - 'packages/manifest/**'
      - 'packages/test/**'
      - 'packages/logging/**'
      - 'packages/slots/**'
      - 'packages/slot-dom/**'
      - 'packages/filesystem/**'
      - 'plugins/**'
      - 'resources/ascii_art.txt'
      - 'tools/scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/tauri.yml'
  push:
    branches: [main]
    paths:
      - 'hosts/tauri/**'
      - 'packages/**'
      - 'plugins/**'
      - 'resources/ascii_art.txt'
      - 'tools/scripts/**'
      - 'package*.json'
      - 'tsconfig*.json'
      - '.github/workflows/tauri.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '26.13.0'
          cache: npm
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - run: npm ci
      - run: npm run tauri:build
