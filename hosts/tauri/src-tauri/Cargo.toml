[package]
name = "lunaris-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri-plugin-opener = "=2.7.3"
lunaris-credentials-native = { path = "../../../plugins/systems/driver/tauri-credentials/native" }
lunaris-filesystem-native = { path = "../../../plugins/systems/driver/tauri-filesystem/native" }
serde_json = "=1.0.154"
serde = { version = "=1.0.229", features = ["derive"] }
tauri = { version = "=2.12.5", features = ["devtools", "tray-icon"] }

[target.'cfg(windows)'.dependencies]
tempfile = "=3.27.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
